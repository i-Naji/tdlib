name: Update TDLib

# Weekly: moves to the newest TDLib that has Android, iOS and desktop builds
# and opens a pull request.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      - id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          dart run tool/update_tdlib.dart
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != 0 ]; then exit "$code"; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version: //p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
          awk 'NR>1 && /^## /{exit} {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-tdlib
          commit-message: update tdlib to ${{ steps.update.outputs.version }}
          title: update tdlib to ${{ steps.update.outputs.version }}
          body-path: ${{ runner.temp }}/notes.md
