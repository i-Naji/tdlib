name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      - name: Generated API is up to date
        run: |
          dart run generator/generate.dart
          dart format lib/src/tdapi
          git diff --exit-code -- lib/src/tdapi

      - run: dart analyze lib test hook tool
      - run: flutter test

  # Builds the example for Linux, which runs the build hook for real
  # (download, checksum, bundling).
  example-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - working-directory: example
        run: flutter build linux --debug
